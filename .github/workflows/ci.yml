# CI Workflow
#
# Runs on all pull requests to develop/release/main and pushes to develop/release/main.
# Validates code quality, runs the full test suite, and enforces the 100% coverage
# gate (see MASTERPLAN.md §11.2). On a push (not a pull request), deploys to the
# matching environment via a reusable workflow only after the test job passes:
# develop -> deploy-dev.yml, release/** -> deploy-staging.yml. Neither reusable
# workflow has a trigger of its own, so a deploy can never happen before (or without)
# CI. Production is not deployed from here — see deploy-prod.yml, which is manually
# dispatched and reuses this workflow's test job (via the workflow_call trigger below)
# instead of duplicating it.

name: CI

on:
  pull_request:
    branches: [develop, "release/**", main]
  push:
    branches: [develop, "release/**", main]
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7
        ports: ["6379:6379"]

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/syncboard-test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret
      RESEND_API_KEY: ci-test-resend-key
      EMAIL_FROM: "SyncBoard <no-reply@syncboard.dev>"
      # Higher than the production default (10) — the integration suite
      # exercises many /auth/* calls against one shared app instance per
      # test file, and the auth-specific limiter is already unit- and
      # integration-tested in isolation with its own low override.
      AUTH_RATE_LIMIT_MAX_REQUESTS: "1000"

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Type Check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Check coverage is 100%
        run: |
          # Extract coverage percentages from Jest output
          COVERAGE_OUTPUT=$(npm run test:unit:coverage 2>&1 | grep "All files" | head -1)

          # Check if all coverage metrics are 100%
          if echo "$COVERAGE_OUTPUT" | grep -E "100\s*\|\s*100\s*\|\s*100\s*\|\s*100" > /dev/null; then
            echo "Coverage check passed - 100% coverage achieved"
          else
            echo "Coverage check failed - coverage is not at 100%"
            echo "$COVERAGE_OUTPUT"
            exit 1
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  deploy-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: test
    uses: ./.github/workflows/deploy-dev.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write

  deploy-staging:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')
    needs: test
    uses: ./.github/workflows/deploy-staging.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write

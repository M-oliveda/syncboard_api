# CI Workflow
#
# Runs on all pull requests to develop/release/main and pushes to develop/main.
# Validates code quality, runs the full test suite, and enforces the 100% coverage
# gate (see MASTERPLAN.md §11.2). On pull requests, deploys a PR preview via the
# reusable Deploy Preview workflow only after the test job passes — deploy-preview.yml
# has no trigger of its own, so a preview can never deploy before (or without) CI.

name: CI

on:
  pull_request:
    branches: [develop, "release/**", main]
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mongo:
        image: mongo:7
        ports: ["27017:27017"]
      redis:
        image: redis:7
        ports: ["6379:6379"]

    env:
      NODE_ENV: test
      MONGO_URI: mongodb://localhost:27017/syncboard-test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret
      JWT_REFRESH_SECRET: ci-test-refresh-secret

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format Check
        run: npm run format:check

      - name: Type Check
        run: npm run type-check

      - name: Build
        run: npm run build

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Check coverage is 100%
        run: |
          # Extract coverage percentages from Jest output
          COVERAGE_OUTPUT=$(npm run test:unit:coverage 2>&1 | grep "All files" | head -1)

          # Check if all coverage metrics are 100%
          if echo "$COVERAGE_OUTPUT" | grep -E "100\s*\|\s*100\s*\|\s*100\s*\|\s*100" > /dev/null; then
            echo "Coverage check passed - 100% coverage achieved"
          else
            echo "Coverage check failed - coverage is not at 100%"
            echo "$COVERAGE_OUTPUT"
            exit 1
          fi

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: ignore

  deploy-preview:
    if: github.event_name == 'pull_request'
    needs: test
    uses: ./.github/workflows/deploy-preview.yml
    secrets: inherit
    permissions:
      contents: read
      id-token: write
      pull-requests: write
